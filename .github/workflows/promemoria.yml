name: Promemoria serale

# GitHub Pages serve solo file statici: non può inviare nulla da solo.
# È questo workflow il pezzo che "sveglia" il telefono, inviando un push
# all'iscrizione del dispositivo. Il service worker decide poi se
# mostrare il promemoria o tacere (se la sessione di oggi è già fatta).

on:
  schedule:
    # 21:00 in Italia = 19:00 UTC con l'ora legale, 20:00 UTC con quella solare.
    # Ne mettiamo due: il service worker sopprime il doppione con lo stesso tag.
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch: {}

jobs:
  invia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa web-push
        run: npm install web-push@3

      - name: Invia il push
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: |
          node -e '
            const webpush = require("web-push");
            const { VAPID_PUBLIC, VAPID_PRIVATE, VAPID_SUBJECT, PUSH_SUBSCRIPTION } = process.env;
            if (!VAPID_PUBLIC || !VAPID_PRIVATE || !PUSH_SUBSCRIPTION) {
              console.log("Secrets mancanti: niente da inviare.");
              process.exit(0);
            }
            webpush.setVapidDetails(VAPID_SUBJECT || "mailto:napema03@icloud.com", VAPID_PUBLIC, VAPID_PRIVATE);
            const sub = JSON.parse(PUSH_SUBSCRIPTION);
            webpush.sendNotification(sub, JSON.stringify({ tipo: "promemoria" }))
              .then(() => console.log("Push inviato."))
              .catch((e) => { console.error("Errore:", e.statusCode, e.body); process.exit(e.statusCode === 410 ? 1 : 0); });
          '
