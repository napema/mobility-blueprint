name: Notifiche

# GitHub Pages è statico e non può mandare push: è questo workflow il
# pezzo che sveglia il telefono. Gira ogni ora e decide dentro lo script
# sull'ora di Roma, così l'ora legale si gestisce da sola.

on:
  schedule:
    - cron: "5 * * * *"   # ogni ora al minuto 5, UTC
  workflow_dispatch:
    inputs:
      forza:
        description: "Invia una notifica di prova anche fuori orario"
        required: false
        default: "0"

jobs:
  invia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install web-push@3 --no-save
      - run: node scripts/push.mjs
        env:
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: BEF9vuHSz44QFNV_jFvlgimpwx0sKdpiW7hStEXAWoUx8LtQo78VLjS76_D-dJGKOfVrkMa-kbuyzrxwG77FXuo
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          FORZA: ${{ github.event.inputs.forza }}
